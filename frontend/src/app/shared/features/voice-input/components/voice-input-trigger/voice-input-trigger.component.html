<!-- #VIWAI_FE_TRIGGER-BUTTON -->
@if (selectors.voiceToTextConverting()) {
  <span class="dots-suffix" aria-live="polite" aria-label="Converting speech to text">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </span>
} @else if (isAvailable()) {
  <button
    class="voice-input-trigger-button"
    type="button"
    aria-label="Voice input"
    data-test="voice-input-trigger"
    tabindex="-1"
    (click)="onVoiceInputClick($event)"
    (mousedown)="preventInputFocus($event)"
  >
    <span class="material-symbols-rounded" aria-hidden="true">mic</span>
  </button>
}

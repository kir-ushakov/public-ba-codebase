<div class="top-panel-holder">
  <div class="top-panel-holder-left">
    <div class="page-header-text">
      <h1 class="page-title" data-test="home-title">Home</h1>
      <p class="page-subtitle" data-test="home-item-count">{{ itemCountLabel }}</p>
    </div>
  </div>
  <div class="top-panel-holder-right">
    @if (selectors.isLoggedIn()) {
      <div class="avatar-holder">
        <ba-mb-home-account-menu
          [avatarInputData]="avatarInputData"
          [userFullName]="selectors.userFullName()"
          [userEmail]="selectors.userEmail()"
        ></ba-mb-home-account-menu>
      </div>
    }
    <div class="header-actions">
      <button class="header-icon-btn" type="button" data-test="home-search" aria-label="Search">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
      </button>
      <button class="header-icon-btn" type="button" data-test="home-more" aria-label="More options">
        <span class="material-symbols-rounded" aria-hidden="true">more_vert</span>
      </button>
    </div>
  </div>
</div>
<div class="main-panel-holder">
  @if (selectors.isLocalAuthenticated()) {
    <ba-mb-home-sync-status></ba-mb-home-sync-status>
  }
  <ba-task-tiles-panel [tasks]="selectors.tasks()"></ba-task-tiles-panel>
</div>
<div class="bottom-panel-holder">
  <ba-mb-home-bottom-panel></ba-mb-home-bottom-panel>
</div>

<div class="login-brand">
  <img class="login-logo" src="assets/ui/main/ba_logo.png" alt="Brain Assistant" />
</div>

<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label class="field-label" for="emailInput">Email</label>
    <div class="field-control" [class.is-invalid]="emailErrorVisible()">
      <span class="material-symbols-rounded field-icon" aria-hidden="true">mail</span>
      <input
        class="field-input"
        id="emailInput"
        data-test="login-email"
        type="email"
        placeholder="Email"
        autocomplete="email"
        formControlName="email"
        [attr.aria-invalid]="emailErrorVisible() ? true : null"
        [attr.aria-describedby]="emailErrorVisible() ? 'login-email-error' : null"
        (blur)="onEmailBlur()"
      />
    </div>
    @if (emailErrorVisible()) {
      <p class="field-error" id="login-email-error" data-test="login-email-error" role="alert">
        <span class="material-symbols-rounded" aria-hidden="true">error</span>
        Please enter a valid email address.
      </p>
    }
  </div>

  <div class="field">
    <label class="field-label" for="passwordInput">Password</label>
    <div class="field-control" [class.is-invalid]="passwordErrorVisible()">
      <span class="material-symbols-rounded field-icon" aria-hidden="true">lock</span>
      <input
        class="field-input"
        id="passwordInput"
        data-test="login-password"
        formControlName="password"
        autocomplete="current-password"
        [type]="passwordVisible() ? 'text' : 'password'"
        [attr.aria-invalid]="passwordErrorVisible() ? true : null"
        [attr.aria-describedby]="passwordErrorVisible() ? 'login-password-error' : null"
        (blur)="onPasswordBlur()"
      />
      <button
        class="visibility-toggle"
        type="button"
        data-test="login-password-visibility"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        (click)="togglePasswordVisibility()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">{{
          passwordVisible() ? 'visibility' : 'visibility_off'
        }}</span>
      </button>
    </div>
    @if (passwordErrorVisible()) {
      <p
        class="field-error"
        id="login-password-error"
        data-test="login-password-error"
        role="alert"
      >
        <span class="material-symbols-rounded" aria-hidden="true">error</span>
        Please input password, not less than 8 symbols
      </p>
    }
  </div>

  <button
    class="login-submit"
    type="submit"
    id="submitBtn"
    data-test="login-submit"
    [disabled]="submitting()"
    [attr.aria-busy]="submitting() ? true : null"
  >
    @if (submitting()) {
      <span class="material-symbols-rounded login-spinner" aria-hidden="true"
        >progress_activity</span
      >
    }
    Login
  </button>
</form>

@if (authError(); as message) {
  <p class="auth-error" data-test="login-auth-error" role="alert">{{ message }}</p>
}

<div class="auth-separator">
  <span>OR</span>
</div>

<ba-sign-in-with-google-btn></ba-sign-in-with-google-btn>

<p class="signup-prompt">
  <span>Don’t have an account?</span>
  <button
    class="signup-link"
    type="button"
    id="signup-link"
    data-test="login-signup"
    (click)="onSignUpClick()"
  >
    Sign Up
  </button>
</p>

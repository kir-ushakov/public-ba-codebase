@let view = view$ | async;
@if (view) {
  <ba-task-type-chip [type]="view.task.type" />
  <h2 class="task-title" data-test="task-view-title">{{ view.task.title }}</h2>
  @if (view.descriptionHtml) {
    <section class="description-card" data-test="task-view-description">
      <p class="description-label">Description</p>
      <div class="description-body" [innerHTML]="view.descriptionHtml"></div>
    </section>
  }
  @if (view.task.imageId; as imageId) {
    <div class="task-picture-holder">
      @if (isImageLoading()) {
        <div class="task-picture-spinner">
          <ba-spinner></ba-spinner>
        </div>
      }
      <img
        class="task-picture"
        [class.is-loading]="isImageLoading()"
        [src]="imageId | imageSrc"
        (load)="onImageLoaded(imageId)"
        (error)="onImageError($event, imageId)"
      />
    </div>
  }
}

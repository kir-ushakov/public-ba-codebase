@let view = view$ | async;
@if (view) {
  <ba-task-type-chip [type]="view.task.type" />
  <h2 class="task-title" data-test="task-view-title">{{ view.task.title }}</h2>
  @if (view.descriptionHtml) {
    <section class="description-card" data-test="task-view-description">
      <p class="description-label">Description</p>
      <div class="description-body" [innerHTML]="view.descriptionHtml"></div>
    </section>
  }
  <ba-image-gallery-editor
    presentation="view"
    [images]="galleryImages()"
    (addImage)="addPhoto()"
    (selectCover)="imageSelectedAsCover($event)"
    (removeImage)="draftImageRemoved($event)"
  />
  <ba-tag-selector presentation="inline" />
}

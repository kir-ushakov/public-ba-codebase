<section class="status-section" data-test="task-status-section">
  <p class="field-label">Status</p>
  <div class="status-options">
    @for (option of options; track option.id) {
      <button
        class="status-option"
        type="button"
        [attr.data-test]="'task-status-' + option.testId"
        [class.is-selected]="selected() === option.id"
        [attr.aria-pressed]="selected() === option.id"
        (click)="select(option.id)"
      >
        <span class="material-symbols-rounded" aria-hidden="true">{{ option.icon }}</span>
        {{ option.label }}
      </button>
    }
  </div>
</section>

<div class="title-input-holder">
  <form class="task-form" [formGroup]="form">
    @if (!isNote()) {
      <ba-task-type-chip [type]="taskType()" />
    }
    <div class="title-field">
      <label class="field-label" for="titleInput">Title</label>
      <div class="title-control">
        <textarea
          class="title-input"
          #titleAutosize="cdkTextareaAutosize"
          id="titleInput"
          cdkTextareaAutosize
          [cdkAutosizeMinRows]="1"
          formControlName="title"
          rows="1"
          [placeholder]="(voiceToTextConverting$ | async) ? '' : titlePlaceholder()"
          autocomplete="off"
          [attr.maxlength]="titleMaxLength"
          data-test="task-title-input"
          (keydown.enter)="$event.preventDefault()"
        ></textarea>
        <ba-voice-input-trigger (recordingStopped)="onVoiceRecordingStopped()" />
      </div>
      <p class="character-count" data-test="task-title-count">
        {{ titleLength }}/{{ titleMaxLength }}
      </p>
    </div>
    <div class="description-field">
      <p class="field-label">Content</p>
      <ba-task-content-switch
        [mode]="contentMode()"
        [descriptionHasContent]="descriptionHasContent()"
        [checklistHasContent]="checklist().length > 0"
        (modeChange)="contentMode.set($event)"
      />
      <div [hidden]="contentMode() !== 'description'">
        <ba-rich-text-editor
          formControlName="description"
          [placeholder]="descriptionPlaceholder()"
        />
      </div>
      <div [hidden]="contentMode() !== 'checklist'">
        <ba-checklist-editor
          [items]="checklist()"
          [canEdit]="true"
          [canCheck]="canCheckChecklist()"
          (itemsChange)="onChecklistChange($event)"
        />
      </div>
    </div>
    <ba-image-gallery-editor
      [images]="galleryImages()"
      (addImage)="addPictureBtnPressed()"
      (selectCover)="imageSelectedAsCover($event)"
      (removeImage)="draftImageRemoved($event)"
    />
    <ba-tag-selector
      [showSelectedTags]="showSelectedTags()"
      [selectedIds]="tagIds()"
      (selectedIdsChange)="onTagIdsChange($event)"
    />
    @if (!isNote()) {
      <ba-status-selector formControlName="status" />
    }
  </form>
</div>

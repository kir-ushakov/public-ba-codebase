<section class="choice-section" data-test="task-conditions-section">
  <p class="field-label">Conditions</p>
  <div class="choice-options">
    @for (option of options; track option.id) {
      <button
        class="choice-option is-compact"
        type="button"
        [attr.data-test]="'task-condition-' + option.testId"
        [class.is-selected]="isSelected(option.id)"
        [attr.aria-pressed]="isSelected(option.id)"
        (click)="toggle(option.id)"
      >
        <span class="material-symbols-rounded" aria-hidden="true">{{ option.icon }}</span>
        {{ option.label }}
      </button>
    }
  </div>
</section>

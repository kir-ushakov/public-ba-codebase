<mat-drawer-container class="task-view-container" hasBackdrop="fasle">
  <mat-drawer-content class="task-view-content">
    @let taskMode = mode();
    @if (taskMode === ETaskViewMode.Create) {
      <header class="page-header">
        <button
          class="header-icon-btn"
          type="button"
          data-test="create-task-back"
          aria-label="Back"
          (click)="goBack()"
        >
          <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
        </button>
        <h1 class="page-title" data-test="create-task-title">Create Task</h1>
      </header>
    } @else {
      <div class="top-panel-holder">
        <ba-task-top-panel></ba-task-top-panel>
      </div>
    }
    <div class="main-panel-holder" [class.is-create]="taskMode === ETaskViewMode.Create">
      @if (taskMode === ETaskViewMode.Create || taskMode === ETaskViewMode.Edit) {
        <ba-task-edit></ba-task-edit>
      }
      @if (taskMode === ETaskViewMode.View) {
        <ba-task-view></ba-task-view>
      }
    </div>
    <div class="bottom-panel-holder">
      <ba-task-bottom-panel></ba-task-bottom-panel>
    </div>
  </mat-drawer-content>
  <mat-drawer #menuDrawer class="task-view-sidemenu" mode="over" position="end">
    <ba-task-side-menu></ba-task-side-menu>
  </mat-drawer>
</mat-drawer-container>

@if (mode() === ETaskViewMode.Create || mode() === ETaskViewMode.Edit) {
  <div class="form-actions">
    <button
      class="form-action form-action-secondary"
      type="button"
      data-test="cancel-changes-btn"
      (click)="cancelChanges()"
    >
      Cancel
    </button>
    @let isEditFormValid = isEditFormValid$ | async;
    <button
      class="form-action form-action-primary"
      type="button"
      id="createTaskBtn"
      data-test="apply-changes-btn"
      [disabled]="!isEditFormValid"
      (click)="applyChanges()"
    >
      {{ submitLabel() }}
    </button>
  </div>
}

@if (mode() === ETaskViewMode.View && (showMarkActive() || showMarkDone())) {
  <div class="form-actions" data-test="task-view-actions">
    @if (showMarkActive()) {
      <button
        class="form-action form-action-secondary"
        type="button"
        data-test="mark-task-active-btn"
        (click)="markActive()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">play_arrow</span>
        Mark as Active
      </button>
    }
    @if (showMarkDone()) {
      <button
        class="form-action form-action-primary"
        type="button"
        data-test="mark-task-done-btn"
        (click)="markDone()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">check</span>
        Done
      </button>
    }
  </div>
}

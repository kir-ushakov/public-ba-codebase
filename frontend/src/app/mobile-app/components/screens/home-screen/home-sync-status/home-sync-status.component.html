<div class="sync-status-banner" [attr.data-test]="testId()">
  <div class="sync-status-leading">
    <span class="material-symbols-rounded account-icon" aria-hidden="true">person</span>
    <span class="material-symbols-rounded warning-badge" aria-hidden="true">warning</span>
  </div>
  <div class="sync-status-copy">
    <p class="sync-status-title">{{ title() }}</p>
    @if (body()) {
      <p class="sync-status-body">{{ body() }}</p>
    }
  </div>
  @if (showAction()) {
    <a class="sync-now-btn" data-test="home-sync-now" routerLink="/sync">
      <span class="material-symbols-rounded" aria-hidden="true">sync</span>
      Sync now
    </a>
  }
</div>

<div class="mode-switcher" role="tablist" aria-label="Home content" data-test="home-content-mode">
  @for (option of options; track option.id) {
    <button
      class="mode-segment"
      type="button"
      role="tab"
      [attr.data-test]="'home-mode-' + option.id"
      [class.is-selected]="selected() === option.id"
      [attr.aria-selected]="selected() === option.id"
      (click)="select(option.id)"
    >
      @if (hasDivider(option.id)) {
        <span class="mode-divider" data-test="home-mode-divider" aria-hidden="true"></span>
      }
      <span
        class="material-symbols-rounded"
        [class.is-filled]="option.iconFill === 1"
        aria-hidden="true"
        >{{ option.icon }}</span
      >
      <span class="mode-label">{{ option.label }}</span>
      <span class="mode-count" [attr.data-test]="'home-mode-count-' + option.id">{{
        counts()[option.id]
      }}</span>
    </button>
  }
</div>

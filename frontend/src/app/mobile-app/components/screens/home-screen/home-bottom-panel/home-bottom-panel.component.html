<button
  class="create-fab"
  type="button"
  [attr.data-test]="page() === 'tags' ? 'tags-create' : 'new-task-btn'"
  [attr.aria-label]="page() === 'tags' ? 'Create tag' : 'Create'"
  (click)="onCreate()"
>
  <span class="material-symbols-rounded" aria-hidden="true">add</span>
</button>

<nav class="bottom-nav" aria-label="Primary">
  <a
    class="nav-item"
    routerLink="/home"
    data-test="bottom-nav-home"
    [class.is-active]="page() === 'home'"
    [attr.aria-current]="page() === 'home' ? 'page' : null"
  >
    <span class="material-symbols-rounded" aria-hidden="true">home</span>
    <span class="nav-label">Home</span>
  </a>
  <span class="nav-item" data-test="bottom-nav-tasks">
    <span class="material-symbols-rounded" aria-hidden="true">calendar_month</span>
    <span class="nav-label">Tasks</span>
  </span>
  <a
    class="nav-item"
    routerLink="/tags"
    data-test="bottom-nav-tags"
    [class.is-active]="page() === 'tags'"
    [attr.aria-current]="page() === 'tags' ? 'page' : null"
  >
    <span class="material-symbols-rounded" aria-hidden="true">sell</span>
    <span class="nav-label">Tags</span>
  </a>
</nav>

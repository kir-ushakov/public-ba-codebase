<div class="task-tile-inner">
  @if (task.imageId) {
    <div class="task-tile-picture">
      @if (isLoading()) {
        <ba-spinner></ba-spinner>
      }
      @if (calculatedImageWidth()) {
        <img
          [src]="task.imageId | imageSrc: calculatedImageWidth()"
          (load)="isLoading.set(false)"
          (error)="onImageError($event)"
        />
      }
    </div>
  }
  <div class="task-tile-body">
    <span class="material-symbols-rounded type-icon" aria-hidden="true">{{ typeIcon }}</span>
    <div class="task-tile-text">
      <div class="task-tile-title-row">
        <span class="task-tile-title">{{ task.title }}</span>
        <button
          class="task-tile-more"
          type="button"
          data-test="task-tile-more"
          aria-label="More options"
          aria-haspopup="menu"
          [attr.aria-expanded]="isMenuOpen()"
          (click)="onMoreClick($event)"
        >
          <span class="material-symbols-rounded" aria-hidden="true">more_vert</span>
        </button>
        @if (isMenuOpen()) {
          <ba-context-menu
            ariaLabel="Task options"
            testId="task-tile-menu"
            [items]="menuItems"
            (closed)="closeMenu()"
            (selected)="onMenuItem($event)"
          ></ba-context-menu>
        }
      </div>
      <div class="task-tile-meta">{{ createdAtLabel }}</div>
    </div>
  </div>
</div>

version: '3'

services:
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    # Dev compose bind-mounts host src and contracts over the image.
    # The host contracts tree has no dist, so ng build fails and nginx 500s.
    volumes: !override
      - frontend_dist:/usr/src/app/dist
    environment:
      - BUILD_MODE=build-prod
      # Cap Angular's Node heap so ng build cannot eat the whole 3GB VDS.
      - NODE_OPTIONS=--max-old-space-size=1536

  backend:
    restart: always
    # Root at start so docker-entrypoint.sh can chown the files volume; it then gosu's to node.
    user: "0"
    volumes:
      - ./nginx/ssl:/usr/ssl
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
      args:
        TSC_MAX_OLD_SPACE_MB: 4096
    environment:
      - PORT=3443
      - CRT_PATH=/usr/ssl/brainassistant.app.crt
      - KEY_PATH=/usr/ssl/brainassistant.app.key

  db:
    # Host 27017 is taken by another Mongo on this VDS. Backend reaches this db by
    # the compose service name, so the container does not need a published port.
    ports: !override []
    # Default WiredTiger cache on a 3GB host is ~512MB plus overhead. 256MB is Mongo's minimum
    # and is enough for a personal task DB.
    command: ["--wiredTigerCacheSizeGB", "0.25"]

  nginx:
    ports: !override
      - '543:543'
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - frontend_dist:/srv/www/static:ro

volumes:
  frontend_dist:

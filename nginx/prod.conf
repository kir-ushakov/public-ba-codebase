server {
    listen 543 ssl;
    server_name 194.32.248.128 brainas.net www.brainas.net brainassistant.app www.brainassistant.app;

    ssl_certificate ssl/brainassistant.app.crt;
    ssl_certificate_key ssl/brainassistant.app.key;

    root /srv/www/static/app/browser;
    try_files $uri $uri/ /index.html;

    client_body_buffer_size     10M;
    client_max_body_size        10M;

    location /api/sync/stream {
        proxy_pass https://backend_api/api/sync/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass  https://backend_api/api/;
    }
}

upstream backend_api {
    server backend:3443;
}
